name: Sync Plugin Version

# The marketplace equivalent of `release.yml` in a scaffolded integration. There, the tag
# is written into `manifest.json` inside the zip HACS installs and the committed value
# never matters. Here the declared version is what gates updates: Claude Code ships users
# a new copy only when `plugin.json`'s version string changes. So the tag still owns the
# number and this writes it back — nothing is typed by hand, and a hand-pushed tag
# overrides. `marketplace.json` deliberately declares no version; plugin.json would
# silently shadow it.
#
# It opens a PR and lets auto-merge land it, rather than pushing to main. A direct push
# needs either a permanent ruleset bypass for RELEASE_TOKEN — standing write access to a
# protected branch, for a saving of one click a month — or the rule disabled by hand at
# every release, which is a manual step in a mechanism whose whole purpose is that there
# isn't one. The PR route keeps every rule enforced and still needs no human typing.
# skill-audit: sanctioned-opener — a marketplace repo's version lives in a committed
# file, so the only alternative to this PR is write access to a protected branch.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    name: Sync plugin version to the tag
    # A prerelease is a candidate, not what the marketplace serves.
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Write the tag version into plugin.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/sync_plugin_version.py --version "$RELEASE_TAG"

      - name: Open a PR and let auto-merge land it
        env:
          # RELEASE_TOKEN, not GITHUB_TOKEN: a PR opened with the default token fires no
          # `pull_request_target` event, so the required checks would never report and
          # auto-merge would wait forever.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet; then
            echo "::notice::manifests already at $RELEASE_TAG"
            exit 0
          fi
          BRANCH="chore/sync-version-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore: sync the plugin version to the release tag"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}" "HEAD:refs/heads/$BRANCH"
          PR=$(gh pr create --base main --head "$BRANCH" \
                 --title "chore: sync the plugin version to the release tag" --body "")
          gh pr merge "$PR" --squash --auto
