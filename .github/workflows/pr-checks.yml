name: PR Checks

# Every PR-time job that WRITES or READS labels, in one workflow so `needs:` can
# order them. Separate workflows cannot be sequenced: the only mechanism would be
# reacting to the `labeled` event, and GitHub suppresses events caused by the
# default GITHUB_TOKEN — so the autolabeler's own label never wakes anything.
# Consumers previously either raced it or polled for it. `needs:` removes both.
#
# Deliberately NOT here: lint_pr, hacs/hassfest/python validation, quality_audit.
# They neither read nor write labels, so folding them in would only couple
# unrelated failures and cost granular status checks.
#
# pull_request_target throughout, because a fork PR gets a read-only token under
# `pull_request` — it could not be labelled, commented on, or have its body
# updated, which is the whole point of these jobs.
# SAFETY: that trigger runs in the base repo's context with a writable token, so
# nothing here may execute PR-authored code. The autolabeler checks out nothing;
# the version gate explicitly checks out the BASE and reads the PR's manifest as
# data over the API; the body/comment jobs never check out at all.
on:
  pull_request_target:
    # NOT `labeled`/`unlabeled`. The autolabeler runs inside this workflow with the
    # default token, and GitHub suppresses events caused by that token, so those
    # types never fire for our own labels. They DO fire for external actors:
    # Dependabot applies three labels at once, which started five runs within two
    # seconds on ha-lego #22. `cancel-in-progress` killed four, and the cancelled
    # check-runs left the rollup FAILURE with nothing actually broken, so the PR
    # was unmergeable.
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- label ----
  # The sole labeler. Everything below that reads labels declares `needs: label`.
  label:
    name: Label from title
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The autolabeler only *adds*. When a PR's title flips type mid-life
      # (fix -> feat), the old label lingers and the PR lists under two
      # release-drafter categories. Remove superseded labels, keyed on the
      # same title the autolabeler reads (removal-only -> cannot flap).
      - name: Remove superseded type labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}  # job has no checkout
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if   printf '%s' "$TITLE" | grep -qiE '^[a-z]+(\([^)]*\))?!:';        then WIN=xfeat
          elif printf '%s' "$TITLE" | grep -qiE '^(chore|docs)(\([^)]*\))?:';   then WIN=chore
          elif printf '%s' "$TITLE" | grep -qiE '^fix(\([^)]*\))?:';            then WIN=fix
          elif printf '%s' "$TITLE" | grep -qiE '^(feat|feature)(\([^)]*\))?:'; then WIN=feature
          else exit 0  # title maps to no managed label; leave labels untouched
          fi
          CURRENT=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          for L in xfeat feature fix chore; do
            [ "$L" = "$WIN" ] && continue
            # `if` (not `grep && gh`): a no-match grep as the step's last command
            # returns 1 under `bash -e`, failing the step even when nothing's wrong.
            if printf '%s\n' "$CURRENT" | grep -qx "$L"; then
              gh pr edit "$PR" --remove-label "$L"
            fi
          done

  # ----------------------------------------------------------- title-check ----
  # Reads labels, so it must follow `label`. No polling: `needs` guarantees the
  # autolabeler has finished, which is what the old standalone workflow could not.
  title-check:
    name: Title is labellable
    needs: label
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      # checkout first: it clears the workspace, so it cannot run after a step
      # that wrote a file there. (skill_audit.sh enforces this.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check for a version-resolvable label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Ground truth is the PR's ACTUAL labels, never a copy of the autolabeler's
          # regexes — a duplicate would drift from .github/release-drafter.yml, and a
          # checker that disagrees with the thing it checks is worse than none.
          # Keep in sync with version-resolver in .github/release-drafter.yml.
          KNOWN="xfeat xfeature major feat feature minor fix bugfix bug patch chore"
          gh pr view "$PR" --json labels --jq '.labels[].name' > labels.txt || true
          FOUND=""
          for l in $KNOWN; do
            grep -qx "$l" labels.txt && { FOUND="$l"; break; }
          done
          if [ -n "$FOUND" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
            echo "PR carries '$FOUND' - title is resolvable."
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::PR has no version-resolvable label; its title type maps to nothing."
          fi

      - name: Suggest a title type from the commits
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GH_REPO/pulls/$PR/commits" \
            --jq '.[].commit.message | split("\n")[0]' > subjects.txt
          WIN=$(python3 scripts/commit_summary.py --mode winning --subjects subjects.txt)
          python3 - "$WIN" > comment.md <<'PYS'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location("cs", "scripts/commit_summary.py")
          cs = importlib.util.module_from_spec(spec); spec.loader.exec_module(cs)
          title, category, bump = cs.SUGGESTIONS[sys.argv[1]]
          print(f"""<!-- pr-title-check -->
          ### This PR's title can't be labelled

          The autolabeler maps the title to a label, release-drafter turns that label into a
          release category, and the version gate resolves the expected bump from it. This
          title matches none of its rules, so the PR has no label, won't appear in the draft
          release notes, and gives the version gate nothing to check.

          `lint_pr` passed because it accepts the full Conventional Commits set — `revert:`
          is the type that clears the lint and still maps to nothing.

          **Suggested type, from this PR's commits: {title}** — files under
          *{category}*, resolves a **{bump}** bump.

          Mapped types: `feat`/`feature` · `fix` · `chore`/`docs`/`refactor`/`perf`/`test`/`build`/`ci`/`style` · any `type!:` for breaking.

          Edit the title and this comment will remove itself. Nothing here changes your title.""".replace(chr(10) + " " * 10, chr(10)))
          PYS
          EXISTING=$(gh api "repos/$GH_REPO/issues/$PR/comments" \
            --jq '[.[] | select(.body | startswith("<!-- pr-title-check -->"))] | .[0].id // ""')
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$EXISTING" -F body=@comment.md --silent
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Withdraw the suggestion once the title is fixed
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          EXISTING=$(gh api "repos/$GH_REPO/issues/$PR/comments" \
            --jq '[.[] | select(.body | startswith("<!-- pr-title-check -->"))] | .[0].id // ""')
          [ -n "$EXISTING" ] && gh api -X DELETE "repos/$GH_REPO/issues/comments/$EXISTING" --silent \
            && echo "removed the stale suggestion" || echo "nothing to withdraw"

  # ---------------------------------------------------------- version-gate ----
  # Reads labels to derive the expected bump, so it must follow `label` too.
  version-gate:
    name: Plugin version bumped and in sync
    needs: label
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PLUGIN_MANIFEST: plugins/ha/.claude-plugin/plugin.json
      MARKETPLACE: .claude-plugin/marketplace.json
      PLUGIN_NAME: ha
    steps:
      # BASE, not the PR head: the token is writable under pull_request_target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Gather versions and labels
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The PR's manifests are read as DATA over the API — never checked out.
          gh api "repos/$GH_REPO/contents/$PLUGIN_MANIFEST?ref=$HEAD_SHA" --jq '.content' \
            | base64 -d > pr_plugin.json
          gh api "repos/$GH_REPO/contents/$MARKETPLACE?ref=$HEAD_SHA" --jq '.content' \
            | base64 -d > pr_marketplace.json
          echo "pr_version=$(jq -r '.version' pr_plugin.json)" >> "$GITHUB_OUTPUT"
          echo "pr_mp_version=$(jq -r --arg n "$PLUGIN_NAME" '.plugins[]|select(.name==$n)|.version' pr_marketplace.json)" >> "$GITHUB_OUTPUT"
          # manifest_gate.py compares against the last PUBLISHED release and uses the
          # base branch's version only as a ceiling. The previous inline gate compared
          # against the base branch alone, so these names differ; emitting the old
          # `base_version` here left both gate inputs empty and it evaluated against
          # 0.0.0.
          echo "main_version=$(jq -r '.version' "$PLUGIN_MANIFEST")" >> "$GITHUB_OUTPUT"
          TAG=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          echo "last_release=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "labels=$(gh pr view "$PR" --json labels -q '[.labels[].name]|join(",")')" >> "$GITHUB_OUTPUT"

      # Decision logic in Python, not inline bash: an untested inline gate shipped a
      # real bug once (strict equality rejected a valid in-cycle version).
      # Untrusted values reach it via env, never `${{ }}` inside run:.
      # This repo carries the version in two files. manifest_gate.py is deliberately
      # single-version (an HA integration has one manifest.json), so the agreement
      # check lives here rather than diverging the shared gate step.
      - name: Manifests agree
        env:
          PR_VERSION: ${{ steps.gather.outputs.pr_version }}
          PR_MP_VERSION: ${{ steps.gather.outputs.pr_mp_version }}
        run: |
          if [ "$PR_VERSION" != "$PR_MP_VERSION" ]; then
            echo "::error::plugin.json ($PR_VERSION) != marketplace.json ($PR_MP_VERSION). Bump both together."
            exit 1
          fi

      - name: Version gate
        # Via env, never `${{ }}` inside run: `pr_version` is read from the PR's own
        # manifest.json, so a fork PR controls that string entirely. Interpolated into
        # the command line it would be shell injection against a writable token.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LAST_RELEASE: ${{ steps.gather.outputs.last_release }}
          MAIN_VERSION: ${{ steps.gather.outputs.main_version }}
          PR_VERSION: ${{ steps.gather.outputs.pr_version }}
          LABELS: ${{ steps.gather.outputs.labels }}
        run: |
          # The count is computed here, not in manifest_gate.py: the gate runs from
          # the trusted base checkout and must not run `git log` over PR-controlled
          # refs. `gh` returns data only, and jq emits an integer.
          BRK=$(gh pr view "$PR_NUMBER" --json commits \
                --jq '[.commits[].messageHeadline | select(test("^[a-zA-Z]+(\\([^)]*\\))?!:"))] | length')
          python3 scripts/manifest_gate.py \
            --last-release "$LAST_RELEASE" \
            --main-version "$MAIN_VERSION" \
            --pr-version "$PR_VERSION" \
            --labels "$LABELS" \
            --breaking-commits "$BRK"

