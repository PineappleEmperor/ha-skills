name: CI

# Documented in README.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Ruff, Pytest and the skill audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install --system --quiet pytest pyyaml ruff

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: python3 -m pytest tests/ -q

      - name: Skill authoring audit
        run: python3 scripts/skill_meta_audit.py

      - name: Skill schema audit
        run: python3 scripts/skill_schema_audit.py

      - name: Home Assistant release freshness
        run: python3 scripts/check_ha_release.py
