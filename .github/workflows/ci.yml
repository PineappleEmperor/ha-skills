name: CI

# Documented in README.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Ruff, Pytest and the skill audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install --system --quiet pytest pyyaml ruff

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: python3 -m pytest tests/ -q

      - name: Skill authoring audit
        run: python3 scripts/skill_meta_audit.py

      - name: Skill schema audit
        run: python3 scripts/skill_schema_audit.py

      - name: Home Assistant release freshness
        run: python3 scripts/check_ha_release.py
