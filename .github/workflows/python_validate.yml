name: Python Validate

# `pull_request`, NOT `pull_request_target`: this job executes the PR's own code
# (pytest collects conftest.py and the test modules). Under pull_request_target a
# fork PR would run arbitrary code with a writable token and repo secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install --quiet pytest markdown-it-py
      - run: python -m pytest tests/ -q
