name: Python Validate

# `pull_request`, NOT `pull_request_target`: this job executes the PR's own code
# (pytest collects conftest.py and the test modules). Under pull_request_target a
# fork PR would run arbitrary code with a writable token and repo secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # uv for the same reason the template uses it: the install is the slow part
      # of this job, and the cache key covers what decides the dependency set.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system --quiet pytest markdown-it-py
      - run: python -m pytest tests/ -q
