name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Sole labeler: release-drafter autolabeler (via the `label` job in pr-checks.yml), keyed on the PR TITLE
# only — a human writes that title, so it must use a mapped type (feat|fix|chore|docs,
# `!` for breaking) or the PR gets no label and no release category. No branch rules
# (they caused label flapping when the branch name disagreed with the commits).
# Breaking `!` rule must precede `feature`.
autolabeler:
  - label: "xfeat"
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: "chore"
    title:
      - '/^(chore|docs|refactor|perf|test|build|ci|style)(\(.+\))?:/i'
  - label: "fix"
    title:
      - '/^fix(\(.+\))?:/i'
  - label: "feature"
    title:
      - '/^(feat|feature)(\(.+\))?:/i'
categories:
  - title: '🚨 Breaking Change'
    semver-increment: major
    labels:
      - 'xfeat'
      - 'xfeature'
      - 'major'
  - title: '🚀 Features'
    semver-increment: minor
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🔧 Fixes'
    semver-increment: patch
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    semver-increment: patch
    labels:
      - 'chore'
  # Bump-only labels: they set the increment without being changelog sections.
  # `version-resolver.<level>.labels` is deprecated; this is its replacement.
  - type: version-resolver
    semver-increment: minor
    labels:
      - 'minor'
  - type: version-resolver
    semver-increment: patch
    labels:
      - 'patch'
# The body is generated by scripts/release_notes.py and written over this.
# If you ever see this text in a published release, that step did not run.
template: |
  _Release notes were not generated._
