# Single source of truth, enforced.
#
# PURPOSE: each load-bearing fact is explained in exactly ONE file. Every other mention of
# it must be a pointer to that file. Not "detect wrong restatements" — prevent restatement.
#
# WHY NOT PHRASE-MATCHING: a deny-list of wrong wordings is unbounded. "bumped manually"
# slipped past a list containing "bump the manifest"; the next writer finds another. This
# check does not read what you claimed, only where you claimed it.
#
# VERIFIED BY: tests/test_skill_meta_audit.py — a restatement in a non-owner file fails, a
# pointer line passes, the owner's own prose passes, and a missing anchor fails.
#
# owner  the file that explains the fact; must carry `<!-- owns: <id> -->`
# terms  topic markers. A line in any other file containing one must link to the owner.

- id: version-model
  owner: reference/versioning.md
  terms:
    - "manifest.json version"
    - "carries a bump"
    - "bump the manifest"
    - "bumped manually"
    - "pre-merge bump"

- id: pr-openers
  owner: reference/github-actions.md
  terms:
    - "opens a PR"
    - "opens PRs"
    - "opens the draft"
    - "opening PRs"

- id: required-contexts
  owner: reference/github-setup.md
  terms:
    - "required status check"
    - "required contexts"
    - "ruleset.json"

- id: merge-discipline
  owner: reference/discipline.md
  terms:
    - "merge with a red check"
    - "merge past a red"
    - "bypass_actors"
    - "--admin"
