# Local hooks for a Home Assistant custom integration. Copy verbatim.
#
# Taken from Home Assistant core's .pre-commit-config.yaml, at core's own pins: the hooks
# that read nothing outside this repository. Core's `repo: local` block is left out, since
# every hook in it runs a script under core's script/ directory. codespell skips a built
# panel bundle, and no-commit-to-branch guards main where core guards dev, master and rc.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass
          - --quiet-level=2
        exclude_types: [csv, json, html]
        exclude: ^custom_components/[^/]+/panel/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: no-commit-to-branch
        args:
          - --branch=main
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.6.2
          - prettier-plugin-sort-json@4.2.0
