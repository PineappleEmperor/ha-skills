name: PR Commit Summary

# Maintains a generated, grouped commit list inside a marked block in the PR
# body. release-drafter's $BODY then reads it as a per-PR mini-changelog.
#
# It does NOT open PRs and does NOT touch the title. Humans open their own PRs
# and write their own titles; lint_pr.yml gates the title format.
#
# pull_request_target (not pull_request) so the token can write to PRs raised
# from forks — an external contributor's PR is the case this exists to serve.
# SAFETY: that trigger runs in the base repo's context with a writable token, so
# this workflow never checks out the PR head and never runs PR-authored code.
# Commit subjects are untrusted input: they are fetched via the API into a file
# and processed by a script that reads that file. Nothing from the PR is ever
# interpolated into a shell command.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-commit-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  summary:
    # Skip bot-authored PRs: Dependabot and friends already carry a machine-written
    # body, and release-drafter's replacers scrub it. Rewriting it adds nothing.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch commit subjects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GH_REPO/pulls/$PR/commits" \
            --jq '.[].commit.message | split("\n")[0]' > subjects.txt
          wc -l < subjects.txt

      - name: Build the grouped summary
        run: |
          python3 - <<'PY'
          import pathlib, re

          subjects = [s for s in pathlib.Path("subjects.txt").read_text().splitlines() if s.strip()]

          TYPE = re.compile(r"^(?P<type>[a-zA-Z]+)(\([^)]*\))?(?P<bang>!)?:\s*(?P<desc>.*)$")
          MAINT = {"chore", "docs", "refactor", "perf", "test", "build", "ci", "style"}
          # The manifest/plugin version bump is release plumbing, not a changelog entry.
          BUMP = re.compile(r"^[a-z]+(\([^)]*\))?:\s*bump\b.*(\bversion\b|\bmanifest\b|\bto v?\d+\.\d+)", re.I)

          groups = {"breaking": [], "feat": [], "fix": [], "maint": [], "other": []}
          for s in subjects:
              if BUMP.match(s):
                  continue
              m = TYPE.match(s)
              if not m:
                  groups["other"].append(s)
                  continue
              t, desc = m.group("type").lower(), m.group("desc")
              if m.group("bang"):
                  groups["breaking"].append(desc)
              elif t == "feat":
                  groups["feat"].append(desc)
              elif t == "fix":
                  groups["fix"].append(desc)
              elif t in MAINT:
                  groups["maint"].append(desc)
              else:
                  groups["other"].append(desc)

          used = [k for k, v in groups.items() if v]
          heads = {
              "breaking": "  **🚨 Breaking**", "feat": "  **🚀 Features**",
              "fix": "  **🔧 Fixes**", "maint": "  **🧰 Maintenance**",
              "other": "  **📦 Other**",
          }
          lines = []
          # Sub-heads only when the PR spans >1 type: release-drafter already files
          # the PR under one category heading, so a lone sub-head just duplicates it.
          for key in ("breaking", "feat", "fix", "maint", "other"):
              if not groups[key]:
                  continue
              if len(used) > 1:
                  lines.append(heads[key])
              lines += [f"  - {d}" for d in groups[key]]

          pathlib.Path("summary.md").write_text("\n".join(lines) or "  - (no commits)")
          PY

      - name: Splice it into the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body --jq '.body // ""' > body.md
          python3 - <<'PY'
          import pathlib

          START, END = "<!-- commit-summary:start -->", "<!-- commit-summary:end -->"
          body = pathlib.Path("body.md").read_text()
          block = f"{START}\n{pathlib.Path('summary.md').read_text().strip()}\n{END}"

          # Replace only the managed block so a human-written description survives.
          if START in body and END in body:
              head, rest = body.split(START, 1)
              _, tail = rest.split(END, 1)
              new = f"{head}{block}{tail}"
          else:
              new = f"{body.rstrip()}\n\n{block}\n" if body.strip() else f"{block}\n"

          if new != body:
              pathlib.Path("new_body.md").write_text(new)
          PY
          if [ -f new_body.md ]; then
            gh pr edit "$PR" --body-file new_body.md
          else
            echo "body already current"
          fi
