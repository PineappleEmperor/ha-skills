name: Skill Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: ha-integration conformance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/skill_audit.py
      # The Python version is written in several files, each read by a different
      # tool. This is the only thing that compares them.
      - run: python3 scripts/version_sync.py
      # Authoring checks for the skills in this repository — frontmatter, router links,
      # docs that match the templates. A scaffolded repo has no `plugins/*/skills/`, so
      # the script is not shipped and this step no-ops there.
      - if: hashFiles('scripts/skill_meta_audit.py') != ''
        run: python3 scripts/skill_meta_audit.py
