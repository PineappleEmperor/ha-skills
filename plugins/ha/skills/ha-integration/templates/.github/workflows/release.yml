name: Create Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Auto release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is the version. HACS installs the asset built here, so the manifest
      # inside this zip is what users actually get, and patching it means no PR has
      # to carry a hand-written bump. frenck/spook patches the same way, from the
      # same event. The committed manifest value is a placeholder between releases.
      #
      # Overriding a bump stays trivial: tag what you want.
      - name: Set the manifest version from the tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "::error::release tag '$RELEASE_TAG' is not a valid version"
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import json, pathlib, sys

          version = sys.argv[1]
          manifest = next(pathlib.Path("custom_components").glob("*/manifest.json"))
          data = json.loads(manifest.read_text())
          data["version"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          print(f"{manifest}: version={version}")
          PY

      # The panel bundle is rebuilt HERE, immediately before packing, rather than in its
      # own workflow. Two workflows on the same `release: published` event cannot be
      # ordered, so a separate rebuild could finish after the zip was already packed and
      # ship the stale bundle it was meant to prevent. A repo with no frontend/ skips it.
      - name: Is there a panel to build
        id: panel
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no frontend/ — nothing to rebuild"
          fi

      - if: steps.panel.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild the panel bundle if it is stale
        if: steps.panel.outputs.present == 'true'
        working-directory: frontend
        run: npm ci && npm run build

      # Reported, not enforced: the zip now carries a fresh build either way, so a stale
      # committed bundle is a repo-hygiene problem rather than a release defect.
      - name: Say whether the committed bundle was stale
        if: steps.panel.outputs.present == 'true'
        run: |
          if git diff --quiet -- 'custom_components/*/panel/*.js'; then
            echo "::notice::committed panel bundle was already current"
          else
            echo "::warning::the committed panel bundle was stale; this release ships a fresh build. Run 'npm run build' in frontend/ and commit it."
          fi

      - name: Create ZIP file
        run: |
          cd custom_components/<domain>
          zip -r "$GITHUB_WORKSPACE/<domain>.zip" . -x '*/__pycache__/*' '*.pyc'

      # No `${{ }}` inside a run block: the expression is substituted as text before
      # the shell sees it, so a crafted tag would execute here. Pass it as env.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/<domain>.zip" --clobber
