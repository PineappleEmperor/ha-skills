name: Dependency Review

# Blocks a PR that introduces a dependency with a known advisory. Runs on the PR's
# own diff, so it costs nothing on branches that touch no dependencies. Free on
# public repos; on a private repo without Advanced Security the action exits with a
# clear message rather than failing the PR.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          # Dependabot raises these on its own schedule; failing a human's unrelated
          # PR for a pre-existing low-severity advisory is noise, not a gate.
          fail-on-severity: high
