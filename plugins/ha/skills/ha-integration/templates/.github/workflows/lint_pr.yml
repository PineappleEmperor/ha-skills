name: Lint PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  main:
    name: CC title validation
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only the types the autolabeler maps. The full Conventional Commits set
          # lets `revert:` through, which then carries no label, no release category
          # and nothing for the version to resolve from.
          types: |
            feat
            fix
            chore
            docs
