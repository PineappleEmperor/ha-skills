name: Hassfest

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

# hassfest is pinned to @master deliberately — that is the ref Home Assistant
# documents, and it must track core's current manifest rules to be worth running.
# Same trade-off and same mitigation as hacs_validate.yml: a mutable ref
# Dependabot cannot bump, so cap the blast radius instead.
permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
