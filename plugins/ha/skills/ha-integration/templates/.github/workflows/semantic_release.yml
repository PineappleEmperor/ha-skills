name: Semantic Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pre
        name: Mark prerelease for rc/beta/alpha tags
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -Eiq '(rc|alpha|beta|dev|a|b)[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          # The body is written by release_notes.py on `release: published`.
          # Leaving this true made both write it, and on ha-lego's v1.0.0rc1 they
          # raced: the published notes carried GitHub's `What's Changed` beneath
          # the grouped sections. The New Contributors block that this flag used
          # to provide is now spliced in by release_notes.py.
          prerelease: ${{ steps.pre.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
