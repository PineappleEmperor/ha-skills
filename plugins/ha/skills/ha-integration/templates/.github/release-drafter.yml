name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# Sole labeler keyed on the PR TITLE only — a human writes that title, so it must use
# a mapped type or the PR gets no label and no release category. Mapped: feat|feature,
# fix, and chore|docs|refactor|perf|test|build|ci|style (all -> chore); any `type!:` ->
# xfeat. NOT mapped: `revert:`, which lint_pr's allowlist rejects for that reason. Keep
# these rules and that allowlist in step. No branch rules (they flapped when the branch
# name disagreed with the commits). Breaking `!` must precede `feature`.
autolabeler:
  - label: "xfeat"
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: "chore"
    title:
      - '/^(chore|docs|refactor|perf|test|build|ci|style)(\(.+\))?:/i'
  - label: "fix"
    title:
      - '/^fix(\(.+\))?:/i'
  - label: "feature"
    title:
      - '/^(feat|feature)(\(.+\))?:/i'
# Each category matches exactly the one label the autolabeler above writes for it, and
# nothing else: pr-checks.yml's title-check compares only these four against what the
# commits entitle the PR to, so an alias it does not know (`enhancement`, `bug`) would
# file a PR under a heading the gate never validated.
categories:
  - title: '🚨 Breaking Change'
    semver-increment: major
    when:
      labels:
        - 'xfeat'
  - title: '🚀 Features'
    semver-increment: minor
    when:
      labels:
        - 'feature'
  - title: '🔧 Fixes'
    semver-increment: patch
    when:
      labels:
        - 'fix'
  - title: '🧰 Maintenance'
    semver-increment: patch
    when:
      labels:
        - 'chore'
  # Bump-only labels, applied by hand: they set the increment without being changelog
  # sections, and title-check ignores them by design, so they are the one sanctioned
  # override of the bump the commits imply.
  # `version-resolver.<level>.labels` is deprecated; this is its replacement.
  - type: version-resolver
    semver-increment: major
    when:
      labels:
        - 'major'
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - 'minor'
  - type: version-resolver
    semver-increment: patch
    when:
      labels:
        - 'patch'
# The body is generated by scripts/release_notes.py and written over this.
# If you ever see this text in a published release, that step did not run.
template: |
  _Release notes were not generated._
